name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - name: Validate the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run validate

      - run: npm run format:check
